# plain html/css/js, nothing to build. netlify just serves the folder.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# the tiny backend for one-time share links (netlify/functions/share.mjs, uses netlify blobs)
[functions]
  directory = "netlify/functions"
